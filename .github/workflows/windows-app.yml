name: Windows app

on:
  push:
    branches: [main]
    paths:
      - 'windows-app/**'
      - 'NuGet.Config'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file Windows app
        run: >-
          dotnet publish windows-app/ChelbasketDesktop/ChelbasketDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChelbasketDesktop-win-x64
          path: artifacts/ChelbasketDesktop.exe
          if-no-files-found: error
          retention-days: 90
